version: 2
updates:
  - package-ecosystem: pip
    directory: '/'
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - '*'

  - package-ecosystem: pip
    directory: '/docs'
    schedule:
      interval: weekly
    groups:
      documentation-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
